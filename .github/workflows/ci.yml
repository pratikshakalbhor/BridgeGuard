name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Compile Compact contracts (including eligibility)
        run: npm run compile

      - name: TypeScript type check (root)
        run: npm run build

      - name: TypeScript type check (frontend)
        run: npm run typecheck --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Run test suite
        run: npm test