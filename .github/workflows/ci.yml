name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Verify or Compile Compact contracts
        run: |
          if command -v compact >/dev/null 2>&1; then
            echo "Compact compiler found. Compiling contracts..."
            npm run compile
          else
            echo "Compact compiler CLI not installed in runner. Verifying committed contracts in contracts/managed/..."
            test -d contracts/managed/bridgeguard && test -d contracts/managed/bridgeguard-v2 && test -d contracts/managed/eligibility-gate
            echo "✓ Pre-compiled managed contract artifacts verified."
          fi

      - name: TypeScript type check (root)
        run: npm run build

      - name: TypeScript type check (frontend)
        run: npm run typecheck --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Run test suite
        run: npm test